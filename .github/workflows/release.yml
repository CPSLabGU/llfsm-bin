name: Build Release Artifacts

on:
  workflow_dispatch:

jobs:
  build_release:
    uses: cpslabgu/swift-workflows/.github/workflows/release.yml@main
    with:
      release_artifacts: |
        .build/release/llfsm-verify
        .build/release/llfsm-verify.exe
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.WORKFLOWS_SSH_PRIVATE_KEY }}
      SSH_PUBLIC_KEY: ${{ secrets.WORKFLOWS_SSH_PUBLIC_KEY }}